# Codecov 設定
# 詳細: https://docs.codecov.com/docs/codecov-yaml
codecov:
  branch: main

coverage:
  status:
    # DOM 依存のモジュールは単体テストがないため、当面は結果の表示だけにして PR を落とさない
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false
